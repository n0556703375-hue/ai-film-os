<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ייבוא תסריט מלא · AI Film OS</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header><h1>ייבוא תסריט מלא</h1><p>פירוק מדורג לסצנות ולשוטים, עם המשך בטוח לאחר תקלה</p></header>
<main><section class="panel active">
<div class="workspace-section">
<label>הפקה</label><select id="project"></select>
<label>תסריט מלא</label><textarea id="screenplay" style="min-height:420px" placeholder="הדביקי כאן את כל התסריט..."></textarea>
<label>קצב שוטים ממוצע לדקה</label><input id="rate" type="number" min="1" max="12" step="0.5" value="5">
<label><input id="generate" type="checkbox" checked> יצירת מפות שוטים ופרומפטים לכל הסצנות</label>
<p class="meta">הייבוא אינו מוחק או מחליף סצנות קיימות. במקרה של התנגשות הוא נעצר ללא שינוי נתונים.</p>
<div class="row"><button id="importButton" onclick="runImport()">פירוק התסריט ויצירת הסרט</button><a href="/">חזרה למערכת</a></div>
<div id="status" class="card" style="margin-top:18px;display:none"></div>
</div></section></main>
<script src="/static/safe_api.js"></script>
<script>
const $=id=>document.getElementById(id);
let retryState=null;
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
async function json(url,options={}){
  let response;
  try{response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});}
  catch(_error){throw new FilmOsApiError('לא ניתן להגיע לשרת. בדקי את החיבור ונסי שוב.',{code:'network_error',retryable:true});}
  return parseApiResponse(response);
}
async function init(){
  const projects=await json('/api/projects');
  $('project').innerHTML=projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const saved=Number(localStorage.getItem('filmOsProjectId'));
  if(saved)$('project').value=String(saved);
}
function setProgress(title,message){$('status').innerHTML=`<h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p>`;}
function completedSummary(progress){
  return `<h3>הייבוא הושלם</h3><p><b>${progress.scenesCreated}</b> סצנות נשמרו.</p><p><b>${progress.shotsCreated}</b> שוטים נוצרו.</p><a href="/">פתיחת AI Film OS</a>`;
}
function failureSummary(error){
  const retry=error&&error.retryable&&retryState?'<div class="row"><button id="retryStageButton" onclick="retryFailedStage()">המשך מהנקודה האחרונה</button></div>':'';
  return `<h3>הייבוא נעצר</h3><p>${escapeHtml(error.message||'אירעה תקלה זמנית.')}</p><p>לא בוצעה החלפה של נתונים קיימים. ניתן להמשיך מהמקטע האחרון שהושלם.</p>${retry}`;
}
async function processBreakdown(state){
  while(!state.completed){
    setProgress('שלב 1 מתוך 3',`מפרקת מקטע ${state.nextChunkIndex+1}${state.chunkCount?` מתוך ${state.chunkCount}`:''}. אין לסגור את החלון.`);
    retryState={type:'breakdown',state};
    const data=await json('/api/import-runs/process-next',{
      method:'POST',
      body:JSON.stringify({
        project_id:state.projectId,
        screenplay:state.screenplay,
        screenplay_fingerprint:state.screenplayFingerprint||'',
        target_shots_per_minute:state.rate,
        next_chunk_index:state.nextChunkIndex,
        scenes:state.scenes
      })
    });
    state.screenplayFingerprint=String(data.screenplay_fingerprint||'');
    state.nextChunkIndex=Number(data.next_chunk_index||0);
    state.chunkCount=Number(data.chunk_count||0);
    state.scenes=Array.isArray(data.scenes)?data.scenes:[];
    state.completed=Boolean(data.completed);
  }
  return state;
}
async function persistBreakdown(state,progress){
  setProgress('שלב 2 מתוך 3','שומרת את הסצנות פעם אחת, ללא החלפת נתונים קיימים.');
  retryState={type:'persist',state,progress};
  const data=await json('/api/import-runs/persist',{
    method:'POST',
    body:JSON.stringify({project_id:state.projectId,completed:true,scenes:state.scenes})
  });
  const scenes=Array.isArray(data.imported_scenes)?data.imported_scenes:[];
  progress.scenesCreated=Number(data.scenes_created||scenes.length||0);
  if(data.idempotent_replay)progress.scenesCreated=scenes.length;
  return scenes;
}
async function createShotMaps(scenes,startIndex,progress){
  for(let index=startIndex;index<scenes.length;index++){
    const scene=scenes[index];
    const count=Number(scene.recommended_shot_count||6);
    retryState={type:'shot-map',scenes,index,progress};
    setProgress('שלב 3 מתוך 3',`יוצרת מפת שוטים לסצנה ${index+1} מתוך ${scenes.length} · ${count} שוטים`);
    const current=await json(`/api/scenes/${scene.id}`);
    if((current.shots||[]).length){
      progress.shotsCreated+=(current.shots||[]).length;
      continue;
    }
    const created=await json(`/api/scenes/${scene.id}/shot-map`,{
      method:'POST',body:JSON.stringify({shot_count:count,replace_existing:false})
    });
    progress.shotsCreated+=(created.shots||[]).length;
  }
}
async function continueImport(state,progress){
  await processBreakdown(state);
  const scenes=await persistBreakdown(state,progress);
  if(state.shouldGenerate)await createShotMaps(scenes,0,progress);
  retryState=null;
  $('status').innerHTML=completedSummary(progress);
}
async function runImport(){
  const screenplay=$('screenplay').value;
  if(screenplay.trim().length<50)return alert('יש להדביק תסריט מלא.');
  const button=$('importButton');
  const state={projectId:Number($('project').value),screenplay,screenplayFingerprint:'',rate:Number($('rate').value),nextChunkIndex:0,chunkCount:0,scenes:[],completed:false,shouldGenerate:$('generate').checked};
  const progress={scenesCreated:0,shotsCreated:0};
  button.disabled=true;$('status').style.display='block';
  try{await continueImport(state,progress);}catch(error){$('status').innerHTML=failureSummary(error);}finally{button.disabled=false;}
}
async function retryFailedStage(){
  if(!retryState)return;
  const button=$('retryStageButton');if(button)button.disabled=true;
  const saved=retryState;
  try{
    if(saved.type==='breakdown')await continueImport(saved.state,{scenesCreated:0,shotsCreated:0});
    else if(saved.type==='persist'){
      const scenes=await persistBreakdown(saved.state,saved.progress);
      if(saved.state.shouldGenerate)await createShotMaps(scenes,0,saved.progress);
      retryState=null;$('status').innerHTML=completedSummary(saved.progress);
    }else{
      await createShotMaps(saved.scenes,saved.index,saved.progress);
      retryState=null;$('status').innerHTML=completedSummary(saved.progress);
    }
  }catch(error){$('status').innerHTML=failureSummary(error);}
}
init().catch(error=>alert(error.message));
</script>
</body></html>
