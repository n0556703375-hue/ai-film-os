name: Production Screenplay Import Smoke

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Existing isolated Render project ID for the smoke import
        required: true
        type: number
      confirmation:
        description: Type RUN_PRODUCTION_IMPORT_SMOKE to allow the import
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-screenplay-import-smoke
  cancel-in-progress: false

jobs:
  verify-import-idempotency:
    if: ${{ inputs.confirmation == 'RUN_PRODUCTION_IMPORT_SMOKE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project input and deployed health
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          raw = os.environ.get("PROJECT_ID", "")
          try:
              project_id = int(raw)
          except ValueError:
              raise SystemExit("project_id must be an integer")
          if project_id <= 0:
              raise SystemExit("project_id must be a positive existing project ID")
          PY
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 \
            https://ai-film-os.onrender.com/health >/dev/null

      - name: Materialize screenplay without logging it
        env:
          SCREENPLAY_B64: ${{ secrets.PRODUCTION_SMOKE_SCREENPLAY_B64 }}
          SCREENPLAY_B64_PART1: ${{ secrets.PRODUCTION_SMOKE_SCREENPLAY_B64_PART1 }}
          SCREENPLAY_B64_PART2: ${{ secrets.PRODUCTION_SMOKE_SCREENPLAY_B64_PART2 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m scripts.materialize_production_screenplay_secret \
            --output production-smoke-screenplay.txt

      - name: Verify deployed import idempotency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/deployment_import_idempotency.py \
            --base-url https://ai-film-os.onrender.com \
            --project-id "${{ inputs.project_id }}" \
            --screenplay-file production-smoke-screenplay.txt \
            --execute-import \
            --timeout-seconds 60 \
            | tee production-smoke-result.json

      - name: Remove screenplay material
        if: always()
        shell: bash
        run: rm -f production-smoke-screenplay.txt

      - name: Upload count-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-screenplay-smoke-result
          path: production-smoke-result.json
          if-no-files-found: warn
          retention-days: 7
