services:
  - type: web
    name: ai-film-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: FILM_OS_DB
        value: /var/data/film_os.db
      - key: GENERATED_MEDIA_PATH
        value: /var/data/generated
    # Production currently runs on a paid Render plan with a persistent disk.
    # Both the SQLite database and generated media must live under /var/data
    # so project state, approvals, jobs, uploaded images, and generated videos
    # survive deploys and restarts.
    disk:
      name: ai-film-os-media
      mountPath: /var/data
      sizeGB: 1
